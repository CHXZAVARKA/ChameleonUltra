name: Merge upstream firmware

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: merge-upstream-main
  cancel-in-progress: false

jobs:
  merge:
    name: Merge RfidResearchGroup/main
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/RfidResearchGroup/ChameleonUltra.git
          git fetch upstream main

      - name: Merge upstream main
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Custom main already contains upstream main."
            exit 0
          fi
          git merge --no-edit upstream/main

      - name: Verify custom slot transaction
        run: make -C firmware/application/tests test

      - name: Push merged main
        run: git push origin HEAD:main
